name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "workspace.html"
      - "account.html"
      - "style.css"
      - "entry.js"
      - "account.js"
      - "app.js"
      - ".nojekyll"
      - "updates/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build strict Pages allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -- index.html workspace.html account.html style.css entry.js account.js app.js .nojekyll _site/
          if [ -d updates ]; then
            cp -R -- updates _site/
          fi

          python3 - <<'PY'
          from pathlib import Path

          root = Path("_site")
          allowed_root = {
              "index.html",
              "workspace.html",
              "account.html",
              "style.css",
              "entry.js",
              "account.js",
              "app.js",
              ".nojekyll",
          }
          files = [p for p in root.rglob("*") if p.is_file()]
          for path in files:
              rel = path.relative_to(root).as_posix()
              if "/" not in rel and rel not in allowed_root:
                  raise SystemExit("unexpected Pages root file: " + rel)
              if "/" in rel and not rel.startswith("updates/"):
                  raise SystemExit("unexpected Pages subtree: " + rel)
              if path.is_symlink():
                  raise SystemExit("symlink forbidden in Pages artifact: " + rel)
          print("PAGES_ALLOWLIST=PASS")
          for path in sorted(files):
              print(path.relative_to(root).as_posix())
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
